<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Interviewer</title>
<link rel="preload" href="/static/fonts/InstrumentSans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 28 28">
    <!-- a speech bubble holding the hire bar: the interviewer, and the bar you're measured against -->
    <path d="M6 4h16a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-9l-5 4v-4H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z" fill="#1b6e66"/>
    <rect x="7" y="11.5" width="14" height="3" rx="1.5" fill="#fff" opacity=".45"/>
    <circle cx="17" cy="13" r="2.6" fill="#fff"/>
  </symbol>
</svg>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a class="mark" href="#/"><svg><use href="#mark"/></svg><div><b>Case Interviewer</b><span>PM casebook</span></div></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home"><svg viewBox="0 0 16 16"><path d="M2.5 7 8 2.5 13.5 7v6.5h-4v-4h-3v4h-4z"/></svg>Home</a>
      <a href="#/cases" data-nav="cases"><svg viewBox="0 0 16 16"><path d="M3 2.5h10v11H3zM5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></svg>Cases<span class="count" id="navCases"></span></a>
      <a href="#/history" data-nav="history"><svg viewBox="0 0 16 16"><path d="M8 4.5V8l2.5 1.5M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.5H5"/></svg>History</a>
      <a href="#/models" data-nav="models"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/><circle cx="5.5" cy="4.5" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/><circle cx="7" cy="11.5" r="1.4"/></svg>Models</a>
      <a href="#/add" data-nav="add"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Add a case</a>
    </nav>
    <div class="sidebar-foot">
      <div id="queue" class="queue" hidden></div>
      <label class="levelpick"><span>Hire bar</span>
        <select id="levelPick" aria-label="Hire bar level">
          <option value="apm">APM</option><option value="pm">PM</option><option value="senior">Senior PM</option>
        </select></label>
      <label class="switch" title="Include simulate.py test runs in averages and history">
        <input type="checkbox" id="includeSim"> Include test runs
      </label>
    </div>
  </aside>
  <div class="sheet">
    <div class="phonebar">
      <a class="mark" href="#/"><svg><use href="#mark"/></svg><b>Case Interviewer</b></a>
      <button class="btn small ghost menu" id="menuBtn" aria-expanded="false" aria-controls="sidebar">Menu</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <main id="app"></main>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
